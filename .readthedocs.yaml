version: 3

environment:
  variables:
    # Prevent rpy2 from trying to find a system R
    RPY2_CFFI_MODE: ABI
    # Extra safety
    R_HOME: ""

build:
  os: ubuntu-20.04
  tools:
    python: "3.11"

python:
  install:
    - method: pip
      path: .
      extra_args:
        - "--no-deps"
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
