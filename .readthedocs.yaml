version: 2

build:
  os: ubuntu-20.04
  tools:
    python: "3.11"

env:
  variables:
    # Prevent rpy2 from trying to find a system R
    RPY2_CFFI_MODE: ABI
    # Extra safety: some rpy2 versions look for this
    R_HOME: ""

python:
  install:
    # Install the package itself WITHOUT dependencies
    - method: pip
      path: .
      extra_args:
        - "--no-deps"

    # Install documentation-only dependencies
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
