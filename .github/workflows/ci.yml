name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Create venv and sync dependencies
        run: |
          uv venv .venv
          # Install all necessary extras: r (for rpy2), dev, and docs
          uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

      - name: Run linter (Ruff only)
        run: uv run ruff check .
