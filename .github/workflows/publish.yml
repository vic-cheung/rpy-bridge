name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine ruff pytest

      - name: Lint
        run: |
          python -m ruff check --fix . || true

      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest -q

      - name: Build distributions
        run: |
          python -m build

      - name: Twine check
        run: |
          python -m twine check dist/*

      - name: Publish to PyPI/TestPyPI
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          REPOSITORY_URL: ${{ secrets.REPOSITORY_URL }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            python -m twine upload --non-interactive --repository-url ${REPOSITORY_URL:-https://upload.pypi.org/legacy/} -u __token__ -p "$PYPI_API_TOKEN" dist/*;
          else
            python -m twine upload --non-interactive --repository-url ${REPOSITORY_URL:-https://upload.pypi.org/legacy/} -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD" dist/*;
          fi
