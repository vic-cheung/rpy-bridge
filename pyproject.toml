[project]
name = "rpy-bridge"
version = "0.1.0"
description = "Bridge helpers for calling R from Python via rpy2"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Victoria Cheung", email = "victoriakcheung@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "rpy2>=3.5",
    "loguru>=0.7",
    "ipykernel>=7.1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/vic-cheung/rpy-bridge"
"Issue Tracker" = "https://github.com/vic-cheung/rpy-bridge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.6",
    "pytest>=8.0",
    "build>=1.0",
    "twine>=4.0",
    "certifi>=2025.0",
]
